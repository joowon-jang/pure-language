name: pure-language
version: "0.2.6"
description: Keep every answer in one language - picks the target from the user's command or message (54 languages) and fixes words and characters leaking in from other languages
author: joowon-jang
requires_hermes: ">=0.23.4"
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - transform_tool_result
  - on_interim_message
  - transform_llm_output
provides_middleware:
  - llm_request
